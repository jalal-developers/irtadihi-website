<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRTADIHI (ارتديه) — Official SVG Vector Logo Suite &amp; Downloader</title>
  <style>
    :root {
      --alabaster: #FBFAF6;
      --subtle: #F4F1EA;
      --charcoal: #504D46;
      --bronze: #9E8C63;
      --border: #E6E1D6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--alabaster);
      color: var(--charcoal);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      padding: 48px 24px 80px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--bronze);
      margin-bottom: 10px;
      display: block;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 34px;
      font-weight: 400;
      margin-bottom: 12px;
      color: var(--charcoal);
    }
    .subtitle {
      font-size: 14.5px;
      color: #736F66;
    }
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .mode-tab {
      padding: 10px 22px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--bronze);
      background: transparent;
      color: var(--charcoal);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab.active, .mode-tab:hover {
      background: var(--charcoal);
      color: var(--alabaster);
      border-color: var(--charcoal);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
    }
    .card {
      background: var(--subtle);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .preview-box {
      width: 100%;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .preview-box.checkerboard {
      background-image:
        linear-gradient(45deg, #EAE6DC 25%, transparent 25%),
        linear-gradient(-45deg, #EAE6DC 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #EAE6DC 75%),
        linear-gradient(-45deg, transparent 75%, #EAE6DC 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #FBFAF6;
    }
    .preview-box svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }
    .card-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-title {
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--charcoal);
    }
    .card-meta {
      font-size: 12px;
      color: #736F66;
      font-family: monospace;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      padding: 11px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      border: 1px solid var(--charcoal);
      transition: all 0.2s ease;
    }
    .btn-download {
      background: var(--charcoal);
      color: var(--alabaster);
    }
    .btn-download:hover {
      background: #3B3833;
      border-color: var(--bronze);
    }
    .btn-copy {
      background: var(--alabaster);
      color: var(--charcoal);
      border-color: var(--bronze);
    }
    .btn-copy:hover {
      background: var(--bronze);
      color: var(--alabaster);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--charcoal);
      color: var(--alabaster);
      border: 1px solid var(--bronze);
      padding: 12px 24px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <span class="eyebrow">100% Pure Editable Vector Paths • Inkscape &amp; Illustrator Ready</span>
      <h1>Irtadihi (ارتديه) — SVG Vector Logo Suite</h1>
      <p class="subtitle">
        Click <strong>Download .SVG File</strong> on any variant below to save the true <code>.svg</code> vector file directly to your computer (with editable Inkscape layers and <code>&lt;path&gt;</code> nodes).
      </p>
    </header>

    <div class="mode-tabs">
      <button class="mode-tab active" onclick="filterMode('all', this)">All 10 SVG Files</button>
      <button class="mode-tab" onclick="filterMode('transparent', this)">Transparent Background (4)</button>
      <button class="mode-tab" onclick="filterMode('alabaster', this)">Warm Alabaster #FBFAF6 (3)</button>
      <button class="mode-tab" onclick="filterMode('dark', this)">Dark Mode #504D46 (3)</button>
    </div>

    <div class="grid" id="cardsGrid"></div>
  </div>

  <div class="toast" id="toast">Downloaded .SVG</div>

    let activeMode = 'all';

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const filtered = ITEMS.filter(item => activeMode === 'all' || item.mode === activeMode);
      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="preview-box ${item.mode === 'transparent' ? 'checkerboard' : ''}">
            ${SVG_FILES[item.file]}
          </div>
          <div class="card-body">
            <div>
              <h3 class="card-title">${item.title}</h3>
              <div class="card-meta">${item.file} • ${item.desc}</div>
            </div>
            <div class="btn-row">
              <button class="btn btn-download" onclick="downloadSvg('${item.file}')">Download .SVG File</button>
              <button class="btn btn-copy" onclick="copySvg('${item.file}')">Copy SVG Code</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterMode(mode, btn) {
      activeMode = mode;
      document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    function downloadSvg(filename) {
      const rawSvg = SVG_FILES[filename];
      const blob = new Blob([rawSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`Downloaded ${filename}`);
    }

    function copySvg(filename) {
      const rawSvg = SVG_FILES[filename];
      if (navigator.clipboard) {
        navigator.clipboard.writeText(rawSvg);
      }
      showToast(`Copied raw <svg> code for ${filename}`);
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    renderCards();
  </script>
